<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Sign Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #1e1e1e;
            --accent: #e8ff00;
            --text: #f0f0f0;
            --muted: #555;
            --success: #00ff88;
            --error: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            z-index: 10;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .dot {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        main {
            width: 100%;
            max-width: 560px;
            margin-top: 5rem;
        }

        h1 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.4rem;
        }

        h1 span { color: var(--accent); }

        .subtitle {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: 4px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(232, 255, 0, 0.03);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        .drop-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .preview-container {
            display: none;
            margin-top: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .preview-container img {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            display: block;
            background: #0d0d0d;
        }

        .btn {
            display: block;
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .result {
            display: none;
            margin-top: 1.5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .result-class {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
            color: var(--success);
        }

        .confidence-bar-wrap {
            margin-top: 0.5rem;
        }

        .confidence-label {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .confidence-val {
            color: var(--accent);
        }

        .bar-bg {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .result-id {
            margin-top: 1rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
        }

        .error-msg {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--error);
            border-radius: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--error);
        }

        .loading {
            display: none;
            margin-top: 1rem;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }

        .spinner {
            display: inline-block;
            width: 12px; height: 12px;
            border: 1px solid var(--muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            padding: 1rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer span {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

<header>
    <div class="dot"></div>
    <span class="logo">GTSRB · CNN Classifier</span>
</header>

<main>
    <h1>Traffic Sign<br><span>Classifier</span></h1>
    <p class="subtitle">CNNBaseline · 43 clases · GTSRB dataset</p>

    <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*">
        <span class="drop-icon">⬆</span>
        <p class="drop-text">Arrastra una imagen o haz clic para seleccionar</p>
    </div>

    <div class="preview-container" id="previewContainer">
        <img id="preview" src="" alt="preview">
    </div>

    <div class="loading" id="loading">
        <span class="spinner"></span> clasificando...
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result" id="result">
        <p class="result-label">Clase detectada</p>
        <p class="result-class" id="resultClass"></p>
        <div class="confidence-bar-wrap">
            <div class="confidence-label">
                <span>Confianza</span>
                <span class="confidence-val" id="confidenceVal"></span>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" id="barFill"></div>
            </div>
        </div>
        <p class="result-id" id="resultId"></p>
    </div>

    <button class="btn" id="classifyBtn" disabled>Clasificar</button>
</main>

<footer>
    <span>Servicio Becario · ITC · Tec de Monterrey</span>
    <span>A01641715</span>
</footer>

<script>
    const API = 'https://cnn.uno21things.dev/predict';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const preview = document.getElementById('preview');
    const classifyBtn = document.getElementById('classifyBtn');
    const result = document.getElementById('result');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');

    let selectedFile = null;

    fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) handleFile(file);
    });

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    function handleFile(file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            previewContainer.style.display = 'block';
        };
        reader.readAsDataURL(file);
        classifyBtn.disabled = false;
        result.style.display = 'none';
        errorMsg.style.display = 'none';
    }

    classifyBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        classifyBtn.disabled = true;
        loading.style.display = 'block';
        result.style.display = 'none';
        errorMsg.style.display = 'none';

        const formData = new FormData();
        formData.append('file', selectedFile);

        try {
            const res = await fetch(API, { method: 'POST', body: formData });
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const data = await res.json();

            document.getElementById('resultClass').textContent = data.class_name;
            document.getElementById('confidenceVal').textContent = data.confidence + '%';
            document.getElementById('resultId').textContent = `class_id: ${data.class_id}`;
            document.getElementById('barFill').style.width = data.confidence + '%';

            loading.style.display = 'none';
            result.style.display = 'block';
        } catch (err) {
            loading.style.display = 'none';
            errorMsg.textContent = 'Error al conectar con el servidor: ' + err.message;
            errorMsg.style.display = 'block';
        }

        classifyBtn.disabled = false;
    });
</script>
</body>
</html>
